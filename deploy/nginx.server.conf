limit_req_zone $binary_remote_addr zone=sejong_lab_rate:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=sejong_lab_connections:10m;

server {
  listen 11191;
  server_name _;
  server_tokens off;

  resolver 127.0.0.11 ipv6=off valid=5s;
  set $target_upstream portal:4200;

  auth_basic "Sejong Nuri Security Lab";
  auth_basic_user_file /etc/nginx/auth.htpasswd;

  client_max_body_size 3m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location / {
    limit_req zone=sejong_lab_rate burst=60 nodelay;
    limit_conn sejong_lab_connections 20;

    proxy_pass http://$target_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }
}
