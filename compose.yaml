name: sejong-nuri-lab-jsp
services:
  command-sandbox:
    build:
      context: .
      target: command-sandbox
    image: sejong-nuri-command-sandbox:local
    network_mode: none
    read_only: true
    tmpfs:
      - /lab:size=4m,uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev
      - /tmp:size=8m,uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev
    volumes:
      - command-socket:/run/s02
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/s02/exec.sock"]
      interval: 10s
      timeout: 3s
      retries: 8

  portal:
    build:
      context: .
      target: portal
    image: sejong-nuri-jsp:local
    depends_on:
      command-sandbox:
        condition: service_healthy
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - portal-data:/data
      - command-socket:/run/s02
    networks: [private]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    environment:
      JAVA_OPTS: "-Xms64m -Xmx256m -XX:ActiveProcessorCount=1 -Xss512k -XX:MaxMetaspaceSize=128m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 25s

  web:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "${LAB_BIND_IP:-0.0.0.0}:${LAB_PORT:-11191}:11191"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private, ingress]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
      - /var/run:size=4m,noexec,nosuid,nodev

networks:
  private:
    internal: true
  ingress:

volumes:
  portal-data:
  command-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=1000,gid=1000,mode=0770
