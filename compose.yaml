name: sejong-nuri-lab
services:
  command-sandbox:
    build: .
    image: sejong-nuri-lab:local
    command: ["node", "portal/server/src/s02-sandbox.mjs"]
    network_mode: none
    user: node
    read_only: true
    tmpfs:
      - /lab:size=4m,uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev
      - /tmp:size=8m,noexec,nosuid,nodev
    volumes:
      - command-socket:/run/s02
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get({socketPath:'/run/s02/exec.sock',path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  portal:
    image: sejong-nuri-lab:local
    depends_on:
      command-sandbox:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    volumes:
      - portal-data:/data
      - portal-uploads:/app/portal/server/uploads
      - command-socket:/run/s02
    networks: [private]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "${LAB_BIND_IP:-0.0.0.0}:${LAB_PORT:-11191}:11191"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private, ingress]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
      - /var/run:size=4m,noexec,nosuid,nodev

networks:
  private:
    internal: true
  ingress:

volumes:
  portal-data:
  portal-uploads:
  command-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=1000,gid=1000,mode=0700
